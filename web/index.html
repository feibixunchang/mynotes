<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的笔记 · NAS 网页版</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{
  --bg:#f4f5f9;--panel:#fff;--line:#e3e6ee;--txt:#1f2430;
  --sub:#374151;--hint:#465264;--acc:#4a5ee5;--orange:#f97316;--danger:#d33;
  /* 一律使用操作系统默认 UI 字体，不再加载任何自定义字体 */
  --font-ui:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
            "Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);
  font-family:var(--font-ui);font-size:16px;font-weight:500}
button,input,select,textarea{font-family:inherit}
button{font-weight:600}
/* 手动刷新时的旋转反馈 */
#reloadBtn.spin span{display:inline-block;animation:mnspin .7s linear infinite}
#reloadBtn:disabled{opacity:.6;cursor:default}
@keyframes mnspin{to{transform:rotate(360deg)}}
#app{display:flex;flex-direction:column;width:100%;height:100vh;height:100dvh;overflow:hidden}
/* 三栏放在 #cols 里，底部状态栏独立一行：手机上隐藏右栏时状态栏仍然可见 */
#cols{display:flex;flex-direction:row;align-items:stretch;flex:1;min-height:0;width:100%}
.col{display:flex;flex-direction:column;min-height:0}
#left{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line)}
#mid{width:330px;flex:none;background:var(--panel);border-right:1px solid var(--line)}
#right{flex:1;min-width:0;background:var(--bg)}
.head{padding:12px 14px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:9px;
  border-bottom:1px solid var(--line);flex:none}
.logo{width:28px;height:28px;border-radius:8px;background:var(--orange);display:inline-flex;
  align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;flex:none}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;
  font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;color:var(--txt);white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.pri:hover{background:#ea6a0a;color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pad{padding:10px 12px;flex:none}
.list{overflow:auto;flex:1;padding:6px 0}
.navitem{padding:9px 14px;cursor:pointer;font-size:15px;font-weight:600;color:var(--sub);
  display:flex;align-items:center;gap:8px;border-left:3px solid transparent}
.navitem:hover{background:#f0f2fb}
.navitem.on{background:#fff3e9;border-left-color:var(--orange);color:#b45309}
.navitem .n{margin-left:auto;font-size:14px;font-weight:600;color:var(--hint)}
.navtitle{padding:12px 14px 4px;font-size:14px;font-weight:700;color:var(--hint);letter-spacing:.5px}
.item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:#f0f2fb}
.item.sel{background:#fff0e4;box-shadow:inset 3px 0 0 var(--orange)}
.item .t{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.item .s{font-size:15px;font-weight:600;color:var(--sub);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:3px}
.item .m{font-size:14px;font-weight:600;color:var(--hint);margin-top:4px;display:flex;gap:10px}
.item.trashed .t{color:#8b93a1;text-decoration:line-through}
input,textarea,select{font-family:inherit;font-size:16px;font-weight:500;color:var(--txt)}
#q{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:#fff;
  font-size:15px;font-weight:600}
#q::placeholder,input::placeholder,textarea::placeholder{color:#6b7483;font-weight:600}
#bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);
  background:var(--panel);flex:none;flex-wrap:wrap}
#title{width:100%;border:none;background:transparent;font-size:23px;font-weight:700;outline:none;
  padding:12px 16px 6px}
#meta{display:flex;align-items:center;gap:10px;padding:0 16px 8px;flex:none;flex-wrap:wrap}
#meta label{font-size:14px;font-weight:700;color:var(--sub)}
#meta input{font-size:15px;font-weight:600;border:1px solid var(--line);border-radius:6px;
  padding:5px 8px;background:#fff;outline:none}
#meta input:focus{border-color:var(--orange)}
#body{flex:1;width:100%;border:none;resize:none;padding:12px 16px;outline:none;
  line-height:1.85;background:transparent;font-size:16px;font-weight:500;min-height:120px}
#preview{flex:1;overflow:auto;padding:14px 20px;line-height:1.85;font-size:16px;font-weight:500}
#preview img{max-width:100%;border-radius:6px}
#preview h1{font-size:28px;margin:.6em 0 .3em}
#preview h2{font-size:24px;margin:.6em 0 .3em}
#preview h3{font-size:20px;margin:.6em 0 .3em}
#preview code{background:#eceff5;padding:2px 6px;border-radius:4px;font-size:15px}
#preview pre{background:#eceff5;padding:12px;border-radius:7px;overflow:auto}
#preview pre code{background:none;padding:0}
#preview blockquote{margin:.5em 0;padding-left:12px;border-left:3px solid var(--orange);color:var(--sub)}
#preview a{color:var(--acc)}
#preview ul,#preview ol{padding-left:1.5em}
#status{height:34px;border-top:1px solid var(--line);background:#eef0f6;flex:none;
  display:flex;align-items:center;gap:16px;padding:0 14px;font-size:14px;font-weight:600;color:var(--sub)}
.dot{width:9px;height:9px;border-radius:50%;background:#2e7d32;display:inline-block;margin-right:6px}
.dot.off{background:#c33}
.hide{display:none!important}
/* 只在手机上出现的按钮（汉堡菜单） */
.only-mobile{display:none}
#drawerMask{display:none}
.empty{padding:28px;text-align:center;color:var(--hint);font-size:15px;font-weight:600}
/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(20,24,34,.55);z-index:20;display:flex;
  align-items:center;justify-content:center;padding:24px}
.box{background:#fff;border-radius:12px;padding:20px 22px;width:min(760px,94vw);
  max-height:86vh;display:flex;flex-direction:column;box-shadow:0 18px 60px rgba(0,0,0,.25)}
.box h3{margin:0 0 12px;font-size:19px}
.gallery{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:12px 0}
.gallery figure{margin:0;background:#f6f7fb;border:1px solid var(--line);border-radius:8px;padding:8px}
.gallery img{width:100%;height:180px;object-fit:contain;background:#fff}
.gallery figcaption{font-size:14px;font-weight:600;color:var(--sub);word-break:break-all;margin-top:6px}
.row{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px}
#toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:#232838;color:#fff;
  padding:10px 20px;border-radius:8px;font-size:15px;font-weight:600;z-index:40;opacity:0;
  transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
/* 中文右键菜单（接管浏览器原生英文菜单） */
.ctx{position:fixed;z-index:60;min-width:190px;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:5px;box-shadow:0 12px 36px rgba(20,24,34,.22);
  font-size:15px;font-weight:600;user-select:none}
.ctx-item{padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--txt);
  display:flex;align-items:center;justify-content:space-between;gap:26px;white-space:nowrap}
.ctx-item:hover{background:#fff0e4;color:#b45309}
.ctx-item .k{font-size:13px;font-weight:600;color:var(--hint)}
.ctx-item.dis{opacity:.38;pointer-events:none}
.ctx-sep{height:1px;background:var(--line);margin:5px 6px}
@media (max-width:1100px){
  #left{width:210px}#mid{width:290px}
}
@media (max-width:980px){
  #left{width:186px}#mid{width:252px}#bar{gap:6px}
  .btn{padding:6px 9px;font-size:14px}
}
/* ---------- 手机 / 窄屏 ---------- */
@media (max-width:720px){
  /* 左栏变成滑出抽屉，不再直接隐藏——否则手机上没有新建/切换笔记本/回收站的入口 */
  #left{display:flex;position:fixed;top:0;left:0;bottom:0;width:82vw;max-width:330px;z-index:30;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 34px rgba(20,24,34,.30);border-right:none}
  #app.drawer-open #left{transform:none}
  #app.drawer-open #drawerMask{display:block}
  #drawerMask{position:fixed;inset:0;background:rgba(20,24,34,.45);z-index:25}
  #mid{width:100%}
  #right{display:none}
  #app.mobile-edit #mid{display:none}
  #app.mobile-edit #right{display:flex}
  .only-mobile{display:inline-flex!important}
  .head{padding:10px 12px;font-size:17px}
  .logo{width:26px;height:26px;border-radius:7px;font-size:15px}
  .btn{padding:9px 13px;font-size:15px}
  .navitem{padding:13px 14px;font-size:16px}
  .item{padding:13px 14px}
  .item .s{margin-top:4px}
  /* 工具栏：一行横向滑动，避免 9 个按钮挤成三行吃掉正文空间 */
  #bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:6px;padding:8px 10px}
  #bar::-webkit-scrollbar{display:none}
  #bar .btn{padding:8px 11px;font-size:14px;flex:none}
  #bar .sp{display:none}
  #wc{flex:none;font-size:13px}
  #q{font-size:16px;padding:11px 12px}
  #title{font-size:21px;padding:12px 14px 4px}
  #meta{padding:0 14px 8px;gap:8px}
  #meta label{font-size:13px}
  #meta input{font-size:16px;padding:7px 9px}
  #meta #bookIn{width:calc(50% - 34px)}
  #meta #tagIn{min-width:90px}
  #body{padding:10px 14px;font-size:17px;line-height:1.8}
  #preview{padding:12px 15px;font-size:17px}
  /* 底部状态栏：只留关键信息，其余可横向滑动查看 */
  #status{height:30px;font-size:12px;gap:10px;padding:0 10px;
    overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  #status::-webkit-scrollbar{display:none}
  #status #rev,#status #lastSave{display:none}
  .mask{padding:12px}
  .box{padding:16px;border-radius:14px;max-height:90vh}
  .box h3{font-size:17px}
  .row .btn{flex:1}
  .gallery{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .gallery img{height:130px}
  #toast{bottom:64px;font-size:14px;padding:9px 16px;max-width:88vw;text-align:center}
  /* 手机上右键菜单用不上，避免长按误触 */
  .ctx{display:none!important}
}
/* 窄屏手机（iPhone SE 之类）再收一点 */
@media (max-width:400px){
  #left{width:88vw}
  .btn{padding:8px 11px;font-size:14px}
  #bar .btn{padding:7px 9px;font-size:13px}
  #status{font-size:11px}
}
</style>
</head>
<body>
<div id="app">
  <div id="drawerMask"></div>
  <div id="cols">
  <div id="left" class="col">
    <div class="head"><span class="logo">笔</span>我的笔记</div>
    <div class="pad"><button class="btn pri" id="newBtn" style="width:100%">＋ 新建笔记</button></div>
    <div class="list" id="nav"></div>
    <div class="pad" style="border-top:1px solid var(--line);display:flex;gap:8px">
      <button class="btn" id="importBtn" style="flex:1">导入 MD</button>
      <a class="btn" href="/api/export.md" download="我的笔记.md" style="flex:1;text-align:center;text-decoration:none">导出全部</a>
    </div>
    <div class="pad" style="padding-top:0">
      <button class="btn danger" id="clearAllBtn" style="width:100%">清空所有笔记</button>
    </div>
  </div>

  <div id="mid" class="col">
    <div class="head"><button class="btn ghost only-mobile" id="menuBtn" title="菜单">☰</button><span id="listTitle">全部笔记</span><span class="sp"></span>
      <button class="btn ghost" id="reloadBtn" title="刷新：重新拉取全部笔记" aria-label="刷新"><span>⟳</span></button>
      <button class="btn ghost hide" id="backBtn" title="返回列表">✕</button></div>
    <div class="pad"><input id="q" placeholder="搜索标题或正文…"></div>
    <div class="list" id="list"></div>
  </div>

  <div id="right" class="col">
    <div id="bar">
      <button class="btn ghost only-mobile" id="backBtnM" title="返回列表">←</button>
      <button class="btn" id="editBtn">编辑</button>
      <button class="btn" id="pvBtn">预览</button>
      <button class="btn" id="imgBtn">看图</button>
      <button class="btn" id="uploadBtn">插入图片</button>
      <span class="sp"></span>
      <span id="wc" style="font-size:14px;font-weight:700;color:var(--sub)">0 字</span>
      <button class="btn" id="pinBtn">置顶</button>
      <button class="btn danger" id="delBtn">删除</button>
      <button class="btn pri" id="saveBtn">保存</button>
    </div>
    <input id="title" placeholder="标题（留空自动取正文首行）">
    <div id="meta">
      <label for="bookIn">笔记本</label>
      <input id="bookIn" list="bookList" placeholder="默认" style="width:150px">
      <datalist id="bookList"></datalist>
      <label for="tagIn">标签</label>
      <input id="tagIn" placeholder="用逗号分隔" style="flex:1;min-width:140px">
    </div>
    <textarea id="body" placeholder="开始写吧…支持 Markdown，可插入图片"></textarea>
    <div id="preview" class="hide"></div>
  </div>
  </div>
  <div id="status">
    <span><i class="dot off" id="liveDot"></i><span id="liveTxt">连接中…</span></span>
    <span id="cnt">笔记 0 条</span>
    <span id="lastSave">尚未保存</span>
    <span class="sp"></span>
    <span id="ver" style="font-weight:700;color:#b45309">v…</span>
    <span id="rev">rev -</span>
  </div>
</div>

<input type="file" id="imgFile" accept="image/*" class="hide">
<input type="file" id="mdFile" accept=".md,.markdown,.txt" class="hide">

<div id="galleryMask" class="mask hide">
  <div class="box">
    <h3>看图 · 本笔记中的图片</h3>
    <div class="gallery" id="gallery"></div>
    <div class="row"><button class="btn pri" id="galleryClose">关闭</button></div>
  </div>
</div>

<div id="trashMask" class="mask hide">
  <div class="box" style="width:min(460px,94vw)">
    <h3 id="trashTitle">确认</h3>
    <div id="trashText" style="font-size:15px;font-weight:600;color:var(--sub)"></div>
    <div class="row">
      <button class="btn" id="trashCancel">取消</button>
      <button class="btn pri" id="trashOk">确定</button>
    </div>
  </div>
</div>

<div id="ctxMenu" class="ctx hide">
  <div class="ctx-item" data-a="cut">剪切<span class="k">Ctrl+X</span></div>
  <div class="ctx-item" data-a="copy">复制<span class="k">Ctrl+C</span></div>
  <div class="ctx-item" data-a="paste">粘贴<span class="k">Ctrl+V</span></div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-a="selectall">全选<span class="k">Ctrl+A</span></div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-a="undo">撤销<span class="k">Ctrl+Z</span></div>
  <div class="ctx-item" data-a="redo">重做<span class="k">Ctrl+Y</span></div>
  <div class="ctx-item hide" data-a="openimg">在新标签页打开图片</div>
</div>

<div id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let notes = new Map();
let selId = null, rev = -1, previewing = false, dirty = false, es = null;
let view = 'all', token = localStorage.getItem('mn_token') || '';
let epoch = -1;

function api(path, opt) {
  opt = opt || {};
  opt.headers = Object.assign({'Content-Type': 'application/json'}, opt.headers || {});
  if (token) opt.headers['Authorization'] = 'Bearer ' + token;
  return fetch(path, opt).then(async r => {
    if (r.status === 401) {
      const t = prompt('服务端要求访问令牌，请输入：', token || '');
      if (t) { token = t.trim(); localStorage.setItem('mn_token', token); return api(path, opt); }
      throw new Error('unauthorized');
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const ct = r.headers.get('content-type') || '';
    return ct.includes('json') ? r.json() : r.text();
  });
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toast); window._toast = setTimeout(() => t.classList.remove('show'), 1900);
}
function flash(msg) { $('#lastSave').textContent = msg; }
function titleOf(n) {
  if (n.title && n.title.trim()) return n.title.trim();
  for (const line of (n.content || '').split('\n')) {
    const t = line.replace(/^#{1,6}\s+/, '').replace(/^>\s?/, '')
      .replace(/^[-*+]\s+/, '').replace(/^\d+\.\s+/, '')
      .replace(/\*\*|`/g, '').trim();
    if (t) return t.slice(0, 30);
  }
  return '未命名笔记';
}
function snippetOf(n) {
  return (n.content || '').split('\n')
    .map(s => s.replace(/!\[[^\]]*\]\([^)]*\)/g, '[图片]')
      .replace(/^#{1,6}\s+/, '').replace(/^>\s?/, '')
      .replace(/^[-*+]\s+/, '').replace(/\*\*|`/g, '').trim())
    .filter(Boolean).join(' ');
}
function fmt(ms) {
  if (!ms) return '--';
  const d = new Date(ms), p = x => String(x).padStart(2, '0');
  const same = d.toDateString() === new Date().toDateString();
  return same ? p(d.getHours()) + ':' + p(d.getMinutes())
    : p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function books() {
  const s = new Set();
  for (const n of notes.values()) if (!n.trashed) s.add(n.bookId || '默认');
  return [...s].sort();
}
function tags() {
  const s = new Set();
  for (const n of notes.values()) if (!n.trashed) (n.tags || []).forEach(t => s.add(t));
  return [...s].sort();
}
function renderNav() {
  const live = [...notes.values()].filter(n => !n.trashed);
  const trashed = [...notes.values()].filter(n => n.trashed).length;
  let html = '<div class="navitem ' + (view === 'all' ? 'on' : '') + '" data-v="all">📒 全部笔记<span class="n">' + live.length + '</span></div>';
  html += '<div class="navtitle">笔记本</div>';
  for (const b of books()) {
    const n = live.filter(x => (x.bookId || '默认') === b).length;
    html += '<div class="navitem ' + (view === 'book:' + b ? 'on' : '') + '" data-v="book:' + esc(b) + '">📁 ' + esc(b) + '<span class="n">' + n + '</span></div>';
  }
  html += '<div class="navtitle">标签</div>';
  for (const t of tags()) {
    const n = live.filter(x => (x.tags || []).includes(t)).length;
    html += '<div class="navitem ' + (view === 'tag:' + t ? 'on' : '') + '" data-v="tag:' + esc(t) + '">🏷 ' + esc(t) + '<span class="n">' + n + '</span></div>';
  }
  html += '<div class="navtitle">其他</div>';
  html += '<div class="navitem ' + (view === 'trash' ? 'on' : '') + '" data-v="trash">🗑 回收站<span class="n">' + trashed + '</span></div>';
  html += '<div class="navtitle">关于</div>';
  html += '<a class="navitem" href="https://github.com/feibixunchang/mynotes/releases/latest"'
        + ' target="_blank" rel="noopener" style="text-decoration:none" title="查看更新日志与安装包">'
        + '🚀 打开发布页<span class="n">↗</span></a>';
  $('#nav').innerHTML = html;
  $('#nav').querySelectorAll('.navitem').forEach(el => el.onclick = () => {
    view = el.dataset.v; renderNav(); renderList();
    $('#listTitle').textContent = view === 'all' ? '全部笔记'
      : view === 'trash' ? '回收站'
      : view.startsWith('book:') ? view.slice(5)
      : '标签：' + view.slice(4);
  });
  $('#bookList').innerHTML = books().map(b => '<option value="' + esc(b) + '">').join('');
  $('#cnt').textContent = '笔记 ' + live.length + ' 条';
  if (view === 'all') $('#listTitle').textContent = '全部笔记';
}
function currentArr() {
  let arr = [...notes.values()];
  arr = arr.filter(n => view === 'trash' ? !!n.trashed : !n.trashed);
  if (view.startsWith('book:')) {
    const b = view.slice(5); arr = arr.filter(n => (n.bookId || '默认') === b);
  } else if (view.startsWith('tag:')) {

function md2html(src) {
  let s = esc(src);
  s = s.replace(/```([\s\S]*?)```/g, (m, c) => '<pre><code>' + c.trim() + '</code></pre>');
  s = s.replace(/^###### (.*)$/gm, '<h6>$1</h6>').replace(/^##### (.*)$/gm, '<h5>$1</h5>')
    .replace(/^#### (.*)$/gm, '<h4>$1</h4>').replace(/^### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/^# (.*)$/gm, '<h1>$1</h1>');
  s = s.replace(/^&gt; ?(.*)$/gm, '<blockquote>$1</blockquote>');
  s = s.replace(/^\s*[-*+] (.*)$/gm, '<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/\*([^*\n]+)\*/g, '<i>$1</i>');
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,
    (m, alt, url) => '<img src="' + esc(url) + '" alt="' + esc(alt) + '">');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.split(/\n{2,}/).map(b => /^<(h\d|ul|ol|pre|blockquote|img)/.test(b.trim()) ? b
    : '<p>' + b.replace(/\n/g, '<br>') + '</p>').join('\n');

}

      else {
        const host = (ctxEl && ctxEl.closest && ctxEl.closest('#preview, .item, #right')) || document.body;
        const r = document.createRange(); r.selectNodeContents(host);
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      }
      toast('已全选'); return;
    }
    if (a === 'undo' || a === 'redo') {
      if (ed) ed.focus({ preventScroll: true });
      document.execCommand(a); fireInput(ed); return;
    }
    if (a === 'openimg') {
      if (ctxEl && ctxEl.tagName === 'IMG' && ctxEl.src) window.open(ctxEl.src, '_blank', 'noopener');
      return;
    }
  } catch (err) { toast('操作失败：' + err.message); }
}
ctxMenu.addEventListener('click', e => {
  const it = e.target.closest('.ctx-item');
  if (!it || it.classList.contains('dis')) return;
  ctxAction(it.dataset.a);
});

setMode(false);
// 版本号只由服务端 /health 维护，前端不再硬编码，避免两端版本不一致。
api('/health').then(h => {
  $('#ver').textContent = 'v' + (h.version || '?') + (h.build ? ' · ' + h.build : '');
}).catch(() => {});
load(true).then(() => { connect(); setInterval(() => load(false), 15000); });
</script>
</body>
