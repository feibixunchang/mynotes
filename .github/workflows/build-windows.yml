name: Build Windows portable

# macOS 无法交叉编译 Windows 可执行文件，因此 Windows 便携包由 GitHub 的
# Windows runner 自动构建。发布 Release 时自动触发，也可手动运行。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要附加资产的 Release tag（留空则用最新 Release）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read version from pubspec
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path 'desktop/pubspec.yaml' -Pattern '^version:\s*(\S+)'
          $full = $line.Matches.Groups[1].Value
          $ver = ($full -split '\+')[0]
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $ver ($full)"

      - name: Pub get
        working-directory: desktop
        run: flutter pub get

      - name: Regression test (trash sync)
        working-directory: desktop
        continue-on-error: true
        env:
          MYNOTES_DATA: ${{ runner.temp }}\mynotes-test-data
        run: flutter test test/trash_sync_test.dart

      - name: Build Windows release
        working-directory: desktop
        run: flutter build windows --release

      - name: Package zero-data portable zip
        id: pkg
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $src = 'desktop\build\windows\x64\runner\Release'
          $stage = Join-Path $env:RUNNER_TEMP "MyNotes-$ver-Windows-x64"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination $stage -Recurse -Force
          # 零数据：构建产物里绝不能带笔记库、配置、日志
          Get-ChildItem -Path $stage -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('notes-data','notes.db','settings.txt','update.json','sync.log','tray.log') -or $_.Name -like '*.log' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path 'LICENSE' -Destination (Join-Path $stage 'LICENSE.txt') -Force
          $readme = @(
            "我的笔记 v$ver - Windows 便携版",
            "",
            "解压到任意目录，双击 my_notes.exe 即可使用；数据保存在同目录的 notes-data。",
            "首次启动会要求设置 4-6 位数字启动锁。",
            "同步（可选）：设置 -> 同步，填写你自己的 NAS 服务地址与令牌；留空则不联网同步。",
            "自动更新：设置 -> 自动更新，默认自动检查 GitHub 官方 Release、选最快渠道下载、校验 SHA-256 后自动安装。",
            "也可以在设置里关闭自动更新，或点「立即检查更新」手动检查。",
            "",
            "本包为构建产物，不含任何笔记、账号、令牌、服务器地址或日志。"
          ) -join "`r`n"
          $readme | Set-Content -Path (Join-Path $stage '使用说明.txt') -Encoding UTF8
          $zip = Join-Path $env:RUNNER_TEMP "mynotes-$ver-windows-x64-portable-clean.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "Packed: $zip"

      - name: Resolve release tag
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          if ([string]::IsNullOrEmpty($tag)) { $tag = '${{ inputs.tag }}' }
          if ([string]::IsNullOrEmpty($tag)) {
            $tag = (gh release view --json tagName --jq .tagName -R '${{ github.repository }}').Trim()
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Target release: $tag"

      - name: Upload zip to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload '${{ steps.tag.outputs.tag }}' '${{ steps.pkg.outputs.zip }}' --clobber -R '${{ github.repository }}'
          gh release view '${{ steps.tag.outputs.tag }}' --json assets --jq '.assets[].name' -R '${{ github.repository }}'
